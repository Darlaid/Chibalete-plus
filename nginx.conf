server {
    listen 80;
    server_name localhost;

    # UX-5A — Límite duro defensivo de uploads (alineado con
    # `MAX_UPLOAD_BYTES` del backend en server/server.js). 2 GiB cubre
    # ecosistemas editoriales reales (EPUB ilustrados, audiolibros
    # completos, PDFs grandes, ZIPs de galerías) sin abrir la puerta a
    # DoS por disco. Si se necesita más, subir aquí y en backend
    # simultáneamente.
    client_max_body_size 2G;
    client_body_timeout 600s;

    root /usr/share/nginx/html;

    location / {
        try_files $uri $uri/ /chibaleteplus/index.html;
    }

    location /chibaleteplus/ {
        alias /usr/share/nginx/html/chibaleteplus/;
        try_files $uri $uri/ /chibaleteplus/index.html;
    }

    location /assets/ {
        alias /usr/share/nginx/html/chibaleteplus/assets/;
    }

    location /uploads/ {
        proxy_pass http://host.docker.internal:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location = /favicon.png {
        alias /usr/share/nginx/html/chibaleteplus/favicon.png;
    }

    location = /chibalete_logo.png {
        alias /usr/share/nginx/html/chibaleteplus/chibalete_logo.png;
    }

    location = /leo_character.png {
        alias /usr/share/nginx/html/chibaleteplus/leo_character.png;
    }

    location /api/ {
        proxy_pass http://host.docker.internal:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # UX-5A — no acumular el body completo antes de proxiar al backend.
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
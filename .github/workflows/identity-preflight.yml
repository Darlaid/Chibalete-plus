name: identity-preflight

# ──────────────────────────────────────────────────────────────────────────
# Job BLOQUEANTE de identidad (CHP-ID-DEPLOY-PREFLIGHT-01A).
#
# Protege las invariantes que sostienen el despliegue de identidad:
#   - todos los artefactos versionados declaran la ruta canónica del padrón;
#   - la fuente canónica no es overrideable fuera de fixtures temporales;
#   - el contrato de grupos en creación y edición de usuarios;
#   - la suite no escribe data/, data-critical/ ni public/uploads/;
#   - la réplica del CIS usada en el shadow comparison sigue siendo equivalente;
#   - el seed local no puede escribir stores reales;
#   - typecheck sin regresiones y build de producción.
#
# Acotado a propósito: NADA aquí depende de stores reales, de red ni de
# secretos. Todas las fixtures son sintéticas y viven en directorios temporales.
# Por eso puede ser bloqueante sin volverse flaky.
# ──────────────────────────────────────────────────────────────────────────

on:
  push:
    paths:
      - 'server/**'
      - 'utils/groupMembership.*'
      - 'engines/metrics/**'
      - 'services/dataService.ts'
      - 'pages/AdminUsuarios.tsx'
      - 'pages/__tests__/**'
      - 'scripts/**'
      - 'docker-compose*.yml'
      - 'Dockerfile*'
      - 'ecosystem.config.cjs'
      - 'package.json'
      - 'tsconfig.json'
      - '.github/workflows/identity-preflight.yml'
      - 'pages/**'
      - 'components/**'
      - 'utils/**'
      - 'engines/**'
      - 'index.tsx'
      - 'App.tsx'
      - 'vite.config.ts'
      - 'nginx.prod.conf'
      - '.dockerignore'
  pull_request:
    paths:
      - 'server/**'
      - 'utils/groupMembership.*'
      - 'engines/metrics/**'
      - 'services/dataService.ts'
      - 'pages/AdminUsuarios.tsx'
      - 'pages/__tests__/**'
      - 'scripts/**'
      - 'docker-compose*.yml'
      - 'Dockerfile*'
      - 'ecosystem.config.cjs'
      - 'package.json'
      - 'tsconfig.json'
      - '.github/workflows/identity-preflight.yml'
      - 'pages/**'
      - 'components/**'
      - 'utils/**'
      - 'engines/**'
      - 'index.tsx'
      - 'App.tsx'
      - 'vite.config.ts'
      - 'nginx.prod.conf'
      - '.dockerignore'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: identity-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  identity-preflight:
    name: identity-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Los stores reales no existen en un clone limpio: data/ y data-critical/
      # no están versionados. Se comprueba que siga siendo así, para que el job
      # falle con un mensaje claro si alguien versionara un padrón por error.
      # Se consulta el índice de git (no el filesystem) y sin nombrar rutas
      # concretas: cualquier archivo bajo esos directorios es una violación.
      - name: Assert que ningún store real está versionado
        run: |
          set -euo pipefail
          tracked=$(git ls-files -- data data-critical public/uploads uploads | head -20)
          if [ -n "$tracked" ]; then
            echo "::error::Hay stores de datos versionados; deben quedar fuera del repositorio:"
            echo "$tracked"
            exit 1
          fi
          echo "OK — ningún store de datos versionado"

      - name: Configuración de despliegue apunta al padrón canónico
        run: npm run verify:deploy-config

      - name: Canonicidad de la fuente de usuarios
        run: npm run test:identity

      # CHP-IDDB-M1-A-R1: flujos de producto cookie-only (server real). Fuera de
      # test:identity para no re-ejecutarse bajo el store-isolation guard.
      # Store-hermético (INSIGHTS/EVENTS/SESSIONS/stores en temp).
      - name: Sesión — flujos de navegador cookie-only (server real)
        run: npm run test:session-browser

      - name: Contrato de grupos y memberships (creación + edición)
        run: npm run test:memberships

      - name: Contrato canónico de métricas (motor de referencia)
        run: npm run test:metric-contract

      # CHP-AI-RUNTIME-MODEL-COMPAT-01A — el runtime no puede volver a apuntar a
      # un modelo retirado. Sin red: los proveedores se inyectan con dobles.
      - name: Compatibilidad de modelos de IA (Gemini textual + breaker)
        run: npm run test:ai-model-compat

      # CHP-STATS-LEGACY-PERF-OBS-01A-R2 — la telemetría del request context es
      # secret-only y read-only. Sin red: el middleware se ejercita con un
      # lector inyectado y la ruta con un servidor efímero en 127.0.0.1.
      - name: Telemetría del request context (autorización + lifecycle)
        run: npm run test:request-context-telemetry

      - name: Equivalencia de la réplica del CIS (shadow comparison)
        run: node scripts/__test__/shadowScopeEquivalence.test.mjs

      - name: El seed local no puede escribir stores reales
        run: node scripts/__test__/seed-local-admin.test.mjs

      - name: Guard de escrituras sobre stores reales
        run: node server/__test__/realStoreGuard.test.js

      - name: La suite no escribe stores reales
        run: node scripts/verify-test-store-isolation.mjs test:identity test:memberships

      - name: Typecheck sin regresiones (ops/ excluido por tsconfig)
        run: npm run typecheck:baseline

      # CHP-CI-MOOK-RELEASE-GATES-01 — las 76 aserciones de MOOK dejan de
      # depender de que alguien las lance a mano. Es la suite real, no una
      # reducida: experienceStore, runtime, studio, review, pilot, freeze,
      # bitácora privada, audio a11y, cubierta y navegación de revisión.
      - name: Suites MOOK (Experiencias, Studio, Runtime, cubierta y navegación)
        run: npm run test:mook

      - name: Build de producción
        run: npm run build

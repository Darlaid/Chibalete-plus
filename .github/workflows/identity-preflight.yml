name: identity-preflight

# ──────────────────────────────────────────────────────────────────────────
# Job BLOQUEANTE de identidad (CHP-ID-DEPLOY-PREFLIGHT-01A).
#
# Protege las invariantes que sostienen el despliegue de identidad:
#   - todos los artefactos versionados declaran la ruta canónica del padrón;
#   - la fuente canónica no es overrideable fuera de fixtures temporales;
#   - el contrato de grupos en creación y edición de usuarios;
#   - la suite no escribe data/, data-critical/ ni public/uploads/;
#   - la réplica del CIS usada en el shadow comparison sigue siendo equivalente;
#   - el seed local no puede escribir stores reales;
#   - typecheck sin regresiones y build de producción.
#
# Acotado a propósito: NADA aquí depende de stores reales, de red ni de
# secretos. Todas las fixtures son sintéticas y viven en directorios temporales.
# Por eso puede ser bloqueante sin volverse flaky.
# ──────────────────────────────────────────────────────────────────────────

on:
  push:
    paths:
      - 'server/**'
      - 'utils/groupMembership.*'
      - 'engines/metrics/**'
      - 'services/dataService.ts'
      - 'pages/AdminUsuarios.tsx'
      - 'pages/__tests__/**'
      - 'scripts/**'
      - 'docker-compose*.yml'
      - 'Dockerfile*'
      - 'ecosystem.config.cjs'
      - 'package.json'
      - 'package-lock.json'
      - 'osv-scanner.toml'
      - 'tsconfig.json'
      - '.github/workflows/identity-preflight.yml'
      - 'pages/**'
      - 'components/**'
      - 'utils/**'
      - 'engines/**'
      - 'index.tsx'
      - 'App.tsx'
      - 'vite.config.ts'
      - 'nginx.prod.conf'
      - '.dockerignore'
  pull_request:
    paths:
      - 'server/**'
      - 'utils/groupMembership.*'
      - 'engines/metrics/**'
      - 'services/dataService.ts'
      - 'pages/AdminUsuarios.tsx'
      - 'pages/__tests__/**'
      - 'scripts/**'
      - 'docker-compose*.yml'
      - 'Dockerfile*'
      - 'ecosystem.config.cjs'
      - 'package.json'
      - 'package-lock.json'
      - 'osv-scanner.toml'
      - 'tsconfig.json'
      - '.github/workflows/identity-preflight.yml'
      - 'pages/**'
      - 'components/**'
      - 'utils/**'
      - 'engines/**'
      - 'index.tsx'
      - 'App.tsx'
      - 'vite.config.ts'
      - 'nginx.prod.conf'
      - '.dockerignore'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: identity-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  identity-preflight:
    name: identity-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Los stores reales no existen en un clone limpio: data/ y data-critical/
      # no están versionados. Se comprueba que siga siendo así, para que el job
      # falle con un mensaje claro si alguien versionara un padrón por error.
      # Se consulta el índice de git (no el filesystem) y sin nombrar rutas
      # concretas: cualquier archivo bajo esos directorios es una violación.
      - name: Assert que ningún store real está versionado
        run: |
          set -euo pipefail
          tracked=$(git ls-files -- data data-critical public/uploads uploads | head -20)
          if [ -n "$tracked" ]; then
            echo "::error::Hay stores de datos versionados; deben quedar fuera del repositorio:"
            echo "$tracked"
            exit 1
          fi
          echo "OK — ningún store de datos versionado"

      - name: Configuración de despliegue apunta al padrón canónico
        run: npm run verify:deploy-config

      - name: Canonicidad de la fuente de usuarios
        run: npm run test:identity

      # CHP-IDDB-M1-A-R1: flujos de producto cookie-only (server real). Fuera de
      # test:identity para no re-ejecutarse bajo el store-isolation guard.
      # Store-hermético (INSIGHTS/EVENTS/SESSIONS/stores en temp).
      - name: Sesión — flujos de navegador cookie-only (server real)
        run: npm run test:session-browser

      # CHP-SEC-PASSWORD-RESET-02: contrato de seguridad del reset público.
      # Bloquea la regresión que exponía el token de recuperación en la respuesta
      # HTTP y revelaba si una cuenta existía. Store-hermético (fixtures en temp),
      # igual que el paso anterior.
      - name: Seguridad — el reset público no expone token ni existencia
        run: npm run test:auth-reset

      # SEC-USERS-01 — reinvitar/desactivar cuentas existentes, política mínima
      # de contraseñas (sin predeterminadas ni hashes del cliente) y rechazo de
      # registros sin id. Servidor real en enforce, stores en temp.
      - name: Seguridad — reinvitación, desactivación y política de contraseñas
        run: npm run test:credential-reset

      # SEC-ACCOUNT-01 — cambio de contraseña propia (Perfil → Seguridad): identidad
      # solo por sesión, contraseña actual, política ≥ 12, credentialVersion++ y
      # revocación entre DOS réplicas reales que comparten stores (temp), tope de
      # intentos, concurrencia y ningún secreto en respuestas/logs/auditoría.
      - name: Seguridad — cambio de contraseña propia (dos réplicas, enforce)
        run: npm run test:self-password

      # SEC-DEPS-02 / ZOD-01, cerrado en V9 65-SEC — GHSA-mrhx-c7xc-m3w5 corregido con
      # zod >= 4.6.6, sin excepción en OSV ni en Trivy. Fija la versión corregida, los
      # topes de las colecciones, el límite de 100 kB y el comportamiento de los esquemas.
      - name: Seguridad — zod corregido y sin excepción (GHSA-mrhx-c7xc-m3w5)
        run: npm run test:zod-exposure

      - name: Contrato de grupos y memberships (creación + edición)
        run: npm run test:memberships

      - name: Contrato canónico de métricas (motor de referencia)
        run: npm run test:metric-contract

      # CHP-EDITORIAL-ROYALTIES-2026-01 F3-A1 — motor puro de episodios
      # económicos multimodo (T1–T19). Sin disco ni red.
      # `!cancelled()`: se ejecuta aunque falle un paso anterior; ese fallo
      # sigue marcando el job como failure (no es continue-on-error).
      - name: Royalties — episodios económicos multimodo (F3-A1)
        if: ${{ !cancelled() }}
        run: npm run test:royalties

      # CHP-AI-RUNTIME-MODEL-COMPAT-01A — el runtime no puede volver a apuntar a
      # un modelo retirado. Sin red: los proveedores se inyectan con dobles.
      - name: Compatibilidad de modelos de IA (Gemini textual + breaker)
        run: npm run test:ai-model-compat

      # CHP-STATS-LEGACY-PERF-OBS-01A-R2 — la telemetría del request context es
      # secret-only y read-only. Sin red: el middleware se ejercita con un
      # lector inyectado y la ruta con un servidor efímero en 127.0.0.1.
      - name: Telemetría del request context (autorización + lifecycle)
        run: npm run test:request-context-telemetry

      - name: Equivalencia de la réplica del CIS (shadow comparison)
        run: node scripts/__test__/shadowScopeEquivalence.test.mjs

      - name: El seed local no puede escribir stores reales
        run: node scripts/__test__/seed-local-admin.test.mjs

      - name: Guard de escrituras sobre stores reales
        run: node server/__test__/realStoreGuard.test.js

      - name: La suite no escribe stores reales
        run: node scripts/verify-test-store-isolation.mjs test:identity test:memberships

      - name: Typecheck sin regresiones (ops/ excluido por tsconfig)
        run: npm run typecheck:baseline

      # CHP-CI-MOOK-RELEASE-GATES-01 — las 76 aserciones de MOOK dejan de
      # depender de que alguien las lance a mano. Es la suite real, no una
      # reducida: experienceStore, runtime, studio, review, pilot, freeze,
      # bitácora privada, audio a11y, cubierta y navegación de revisión.
      - name: Suites MOOK (Experiencias, Studio, Runtime, cubierta y navegación)
        run: npm run test:mook

      # CHP-GAMIFICACION-G0-01 — contención de la gamificación simulada: Leo no
      # concede puntos por token, sin canjes ni aprobaciones simuladas, Trivia
      # fuera de la navegación, corte por tiempo ≠ «Lectura Completada», y la
      # Tienda (render real con catálogo Woo) sin canje.
      # CHP-TECH-STABILITY-01 — las dos exportaciones ZIP por HTTP real.
      - name: Exportaciones ZIP
        run: npm run test:exports

      - name: Contención de gamificación (G0)
        run: npm run test:gamification-g0

      # CHP-GAMIFICACION-G3-01/02 — núcleo persistente del ledger sobre bases
      # temporales: flag OFF sin archivo, política de emisión (el llamador no
      # fija montos) y topes en America/Bogota, idempotencia, réplicas en
      # procesos separados (escrituras, topes, reconciliación, caída abrupta),
      # snapshot = Σ ledger, backup/restore con capture_sqlite y entrada en
      # línea que no bloquea la operación. G3-03: MOOK como fuente (adaptadores,
      # corte de activación, reconciliador entre réplicas) y server.js real por
      # HTTP con el motor OFF, roto y activo: respuestas MOOK idénticas.
      - name: Núcleo del ledger de gamificación (G3)
        run: npm run test:gamification-core
      # V9R RC-1 — B2C como comprobación obligatoria de candidata: aprovisionamiento desde la tienda, activación
      # efectiva, representación de menores, operaciones de representación y restablecimiento de contraseña, con sus
      # pruebas de integración (servidor real). Sus cuatro suites unitarias salieron de test:v81 para no correr dos veces.
      # Las de integración escriben el secreto de aprovisionamiento en su ruta fija (/app/secrets) y por eso solo
      # corren con un permiso explícito en un entorno desechable; este ejecutor lo es. Sin ese permiso se omiten con
      # código 0: aquí una omisión cuenta como fallo.
      - name: B2C (aprovisionamiento, activación y representación)
        env:
          CHP_B2C_TEST_SECRET_SANDBOX: '1'
        run: |
          set +e
          sudo mkdir -p /app/secrets && sudo chown -R "$(id -u):$(id -g)" /app
          npm run test:b2c > b2c.log 2>&1; rc=$?
          cat b2c.log
          if grep -a -q "SKIP" b2c.log; then echo "::error title=test-b2c::una suite B2C se omitió"; rc=1; fi
          rm -f b2c.log
          exit $rc

      # CHP-V8.1-CLOSE-02 — A2 (registro y criterio único), resumen de Aula Viva
      # con A2 y el verificador O8 con anulaciones. O8 se ejecuta contra el
      # checkout (O8_APP_ROOT): en la imagen es /app.
      - name: A2, Aula Viva y O8 (V8.1)
        env:
          O8_APP_ROOT: ${{ github.workspace }}
        # V9 65E-C1: mismo comando y mismo criterio de fallo. Si falla, las aserciones fallidas se publican además
        # como anotaciones del job (el registro completo solo lo ve quien administra el repositorio): así un fallo
        # que solo ocurre en este ejecutor se puede diagnosticar sin permisos especiales.
        run: |
          set +e
          npm run test:v81 > v81.log 2>&1; rc=$?
          cat v81.log
          if [ $rc -ne 0 ]; then
            grep -a -v "^[[:space:]]*$" v81.log | tail -n 2 | cut -c1-300 | sed 's/^/::error title=test-v81 (final)::/'
            grep -a "✗\|excepci" v81.log | grep -a -v " 0 ✗\|0 fail\|0 fallid" | tail -n 7 | cut -c1-900 | sed 's/^/::error title=test-v81::/'
          fi
          rm -f v81.log
          exit $rc

      - name: Build de producción
        run: npm run build

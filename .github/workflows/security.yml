name: security

# P0 — STOP THE BLEED: secret scanning + SCA + container/IaC scan.
# Gate de seguridad. NO toca runtime, build ni deploy: solo analiza.
#
# Criterios fail/pass:
#   - gitleaks-head (working tree): CUALQUIER secreto activo → FAIL (gate duro).
#   - gitleaks-history (historial): hallazgo → REPORTE no bloqueante
#     (continue-on-error) — secreto histórico ya removido de HEAD, scrub
#     pendiente como sprint aparte (ver docs/V4-SECURITY-AUDIT.md §9-§10).
#   - OSV-Scanner (package-lock.json): vuln conocida sin ignore razonado → FAIL.
#   - Trivy fs + config (código/deps/IaC): HIGH/CRITICAL con fix → FAIL (gate duro).
#   - Trivy image (api/front): HIGH/CRITICAL → REPORTE no bloqueante
#     (continue-on-error) — los CVEs de imagen base se ratchean en cadencia
#     propia, no por push. Ver docs/V4-SECURITY-AUDIT.md §10.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"   # lunes 06:00 UTC — re-scan de deps/imagen

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── P0.1a — Secret scanning HEAD / working tree — BLOQUEANTE ────────────
  # Cualquier secreto presente en el árbol actual → FAIL. Esta es la garantía
  # dura: HEAD nunca contiene credenciales activas.
  gitleaks-head:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4   # fetch-depth default: solo HEAD, sin historial
      - name: Install gitleaks (binario oficial, sin licencia)
        run: |
          VER=8.21.2
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: gitleaks dir (HEAD / working tree)
        run: gitleaks dir . --config .gitleaks.toml --redact -v --exit-code 1

  # ── P0.1b — Secret scanning HISTORIAL — REPORTE (no bloqueante) ─────────
  # El historial contiene un ADMIN_SECRET ya REMOVIDO de HEAD (verify_pipeline.cjs
  # → process.env en v4.0.1). Rotación en VPS + history scrub son tareas
  # separadas y rastreadas (ver docs/V4-SECURITY-AUDIT.md §9-§10).
  # Este job REPORTA el hallazgo histórico pero NO bloquea el release:
  # gitleaks-head es el gate duro. NO se desactiva gitleaks — se reporta.
  gitleaks-history:
    runs-on: ubuntu-latest
    continue-on-error: true       # reporta findings históricos sin bloquear el workflow
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # historial completo (detecta creds ya commiteadas)
      - name: Install gitleaks (binario oficial, sin licencia)
        run: |
          VER=8.21.2
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: gitleaks detect (historial completo)
        run: gitleaks detect --source . --config .gitleaks.toml --redact -v --exit-code 1

  # ── CHP-SEC-ADMIN-EVIDENCE-HARDEN-01B — evidencia sin captura de secretos ──
  # BLOQUEANTE. Dos gates independientes:
  #
  #   lint:evidence  — ratchet sobre TODO lo versionado. Falla si reaparece un
  #                    patrón que ya produjo credenciales en disco: docker
  #                    inspect crudo, compose config persistido, copia de .env,
  #                    Config.Env con valores, secreto en un prompt de `read`,
  #                    secreto en argv, volcado de entorno.
  #   test:evidence  — el helper, los redactores por formato, el escáner y la
  #                    provisión segura, contra fixtures sintéticas generadas
  #                    en tiempo de ejecución (nada con forma de credencial
  #                    entra al repositorio, así que gitleaks no necesita
  #                    excepciones nuevas).
  #
  # No necesita red, ni Docker, ni secretos: por eso puede bloquear sin volverse
  # flaky. Ver docs/ops/SAFE_OPERATIONAL_EVIDENCE.md.
  evidence-hardening:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Ratchet de captura de secretos (versionado completo)
        run: npm run lint:evidence
      - name: Contrato de evidencia, redacción, escáner y provisión
        run: npm run test:evidence

  # ── P0.2a — SCA npm (protobufjs/firebase/vite/etc.) ─────────────────────
  osv-scanner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: OSV-Scanner (lockfile)
        uses: google/osv-scanner-action/osv-scanner-action@v2.0.0
        with:
          scan-args: |-
            --lockfile=package-lock.json
            --config=osv-scanner.toml

  # ── P0.2b — Trivy: filesystem + config (código/deps/IaC) — BLOQUEANTE ───
  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trivy filesystem (vuln + misconfig + secret)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore

      - name: Trivy config (docker-compose + Dockerfiles + nginx)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
          trivyignores: .trivyignore

  # ── P0.2c — Trivy: imágenes Docker — REPORTE (no bloqueante) ────────────
  # Las imágenes base (node:alpine / nginx:alpine) arrastran CVEs de paquetes
  # OS que se parchean al ritmo del rebuild del base image upstream, no por
  # push. Este job REPORTA esos findings (visibles, exit-code 1) pero NO
  # bloquea el merge (continue-on-error): el gate duro de deps/código/IaC es
  # el job `trivy`. El ratcheo del base image se hace en cadencia propia.
  # CHP-RELEASE-IMAGE-01A — gate DURO de completitud de la imagen API.
  #
  # A diferencia de `trivy-image` (que reporta deuda de la imagen base sin
  # bloquear), este job SÍ bloquea: verifica que la imagen contenga todo el
  # código de runtime (server/, utils/, engines/), que las dependencias
  # instaladas correspondan al lockfile, y que NO contenga stores ni secretos.
  #
  # Existe porque la imagen af319ca se construía con `npm install` sin lockfile
  # y sin copiar utils/ ni engines/: quedó con multer 2.1.1 en vez de 2.2.0 y
  # sólo arrancaba gracias a bind mounts de código.
  image-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Contrato estático (Dockerfile + .dockerignore + lockfile)
        run: node scripts/verify-image-integrity.mjs

      - name: Build api image
        run: docker build -f Dockerfile.api -t chibalete/api:integrity .

      - name: Integridad de la imagen construida
        run: node scripts/verify-image-integrity.mjs chibalete/api:integrity

  trivy-image:
    runs-on: ubuntu-latest
    continue-on-error: true       # reporta CVEs de imagen base sin bloquear el workflow
    steps:
      - uses: actions/checkout@v4

      - name: Build api image (scan target)
        run: docker build -f Dockerfile.api -t chibalete/api:ci .
      - name: Trivy image — chibalete/api
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: chibalete/api:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore   # mismas supresiones auditadas que fs/config

      - name: Build front image (scan target)
        run: docker build -f Dockerfile.front -t chibalete/front:ci .
      - name: Trivy image — chibalete/front (incluye nginx base)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: chibalete/front:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore   # mismas supresiones auditadas que fs/config

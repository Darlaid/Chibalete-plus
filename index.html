<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chibalete+</title>
  <link rel="icon" type="image/png" href="/favicon.png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- PDF.js self-hosted (P0.5) — v3.11.174 pinneada en /public/vendor/pdfjs/.
       Sin CDN externo: elimina riesgo supply-chain y habilita offline futuro.
       MISMA versión que antes (cero cambio de comportamiento). -->
  <script src="/vendor/pdfjs/pdf.min.js"></script>
  <!-- Fonts: Inter (UI) and Merriweather (Reading) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Merriweather:ital,wght@0,300;0,400;0,700;1,400&display=swap"
    rel="stylesheet">
  <!-- OpenDyslexic Font -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/opendyslexic@2.1.0-beta2/medium/stylesheet.min.css">
  <style>
    :root {
      --font-ui: 'Inter', sans-serif;
      --font-reading: 'Merriweather', serif;
    }

    body {
      font-family: var(--font-ui);
      overscroll-behavior-y: none;
    }

    .font-reading {
      font-family: var(--font-reading);
    }

    .font-opendyslexic {
      font-family: 'OpenDyslexic', sans-serif !important;
    }

    /* Glassmorphism Utilities */
    .glass {
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .dark .glass {
      background: rgba(17, 24, 39, 0.7);
    }

    /* Selection highlight for "Imagine" feature */
    ::selection {
      background-color: #c7d2fe;
      /* indigo-200 */
      color: #312e81;
      /* indigo-900 */
    }

    /* Hide Scrollbar but keep functionality */
    .scrollbar-hide::-webkit-scrollbar {
      display: none;
    }

    .scrollbar-hide {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "react-router-dom": "https://aistudiocdn.com/react-router-dom@^7.9.6",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.554.0",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.30.0",
    "canvas-confetti": "https://aistudiocdn.com/canvas-confetti@^1.9.4"
  }
}
</script>
  <!-- PDF.js Worker Configuration -->
  <script>
    if (typeof pdfjsLib !== 'undefined') {
      pdfjsLib.GlobalWorkerOptions.workerSrc = '/vendor/pdfjs/pdf.worker.min.js';
    }
  </script>
  <link rel="stylesheet" href="/index.css">
</head>

<body
  class="bg-gray-50 dark:bg-gray-950 text-gray-900 dark:text-gray-100 antialiased selection:bg-indigo-500 selection:text-white">
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>

upstream api {
    server chibalete_api_1:3000;
    server chibalete_api_2:3000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    # UX-5A — Límite duro defensivo de uploads (alineado con
    # `MAX_UPLOAD_BYTES` del backend en server/server.js). NO es un cap
    # editorial artificial — es la frontera contra abuso por DoS de disco.
    # 2 GiB cubre con holgura asset editorial real (EPUB ilustrados,
    # audiolibros completos, PDFs grandes, ZIPs de galerías). Si en el
    # futuro se necesita más, subir aquí y en backend simultáneamente.
    client_max_body_size 2G;
    # Cliente puede tardar varios minutos en subir un asset pesado por
    # red lenta; aumentamos el tope de "tiempo entre lecturas del body".
    client_body_timeout 600s;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /api/ {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # UX-5A — uploads grandes: nginx NO debe acumular el body completo
        # antes de pasarlo a multer. Con buffering activo, un upload de
        # 2 GiB se quedaría en /var/cache/nginx hasta terminar, agregando
        # latencia y duplicando E/S. `off` envía cada chunk en cuanto
        # llega; multer (diskStorage) escribe directo al TEMP_DIR.
        proxy_request_buffering off;
        # Tiempos extendidos para uploads/downloads pesados por red lenta.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location /uploads/ {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location /downloads/ {
        alias /usr/share/nginx/html/downloads/;
        add_header Content-Disposition 'attachment; filename="chibalete-lu.apk"';
        add_header X-Content-Type-Options nosniff;
        types {
            application/vnd.android.package-archive apk;
        }
        default_type application/octet-stream;
    }
}

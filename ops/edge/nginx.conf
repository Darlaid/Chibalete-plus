# Chibalete+ EDGE nginx — M1 hardening 2026-05-25
# Backup original: /opt/chibaleteplus/m1-hardening/snapshot-20260525-151251/configs/edge-nginx.conf.original
# Rollback: cp <backup> /opt/chibaleteplus/nginx/nginx.conf && docker exec chibalete_edge nginx -s reload
# 2026-06-25: + vhost studio.chibaleteeditores.com -> studio_bi_front (routing por host)

worker_processes auto;

events {
  worker_connections 4096;   # M1: 1024 -> 4096 (8192 total conn por 2 workers)
  multi_accept on;           # M1: aceptar multiples conn por evento
  use epoll;                 # M1: explicito (default en Linux)
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # M1 — log format con request_time + upstream_response_time
  log_format chibalete_main "$remote_addr - $remote_user [$time_local] "
                            "\"$request\" $status $body_bytes_sent "
                            "\"$http_referer\" \"$http_user_agent\" "
                            "rt=$request_time uct=\"$upstream_connect_time\" "
                            "uht=\"$upstream_header_time\" urt=\"$upstream_response_time\"";
  access_log /var/log/nginx/access.log chibalete_main;
  error_log  /var/log/nginx/error.log warn;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 30s;          # M1: 15s -> 30s (mas cache de conn)
  keepalive_requests 1000;
  reset_timedout_connection on;   # M1: liberar mem de conn muertas
  server_tokens off;              # M1: no leak version

  # M1 — gzip ya estaba; mantengo + agrego brotli si esta dispo (alpine no lo trae built-in)
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/xml
    application/rss+xml
    image/svg+xml;

  # M1 — SSL hardening
  resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
  resolver_timeout 5s;
  ssl_session_cache shared:SSL:50m;
  ssl_session_timeout 1d;
  ssl_session_tickets on;
  ssl_session_ticket_key /etc/nginx/ssl/ticket.key;
  ssl_stapling on;
  ssl_stapling_verify on;
  ssl_buffer_size 4k;  # M2: reduce first-byte latency for TLS 1.3
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;

  # CHP-EDGE-DRAIN-01 — el pool de API vive en un directorio bind-mounted
  # para que un `mv` atomico en el host sea visible dentro del contenedor.
  # Un bind mount de FICHERO ancla el inodo y hace el cambio invisible.
  include /etc/nginx/dynamic/*.conf;

  upstream chibalete_front_upstream {
    server chibalete_front:80;
    keepalive 32;                  # M1: 16 -> 32
  }

  # 2026-06-25 — Studio Editor BI front (app separada en studio_bi_net)
  upstream studio_bi_upstream {
    server studio_bi_front:80;
    keepalive 16;
  }

  # HTTP -> HTTPS
  server {
    listen 80;
    listen [::]:80;
    server_name chibaleteplus.chibaleteeditores.com;
    # M1 — return en server-level bypassea locations; movido a location /
    location = /healthz { access_log off; return 200 "ok
"; }
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
  }

  # 2026-06-25 — Studio HTTP -> HTTPS (acme-challenge + redirect)
  server {
    listen 80;
    listen [::]:80;
    server_name studio.chibaleteeditores.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
  }

  server {
    listen 443 ssl;
    listen [::]:443 ssl;
    listen 443 quic reuseport;          # M2: HTTP/3 over UDP
    listen [::]:443 quic reuseport;     # M2: HTTP/3 IPv6
    http2 on;
    http3 on;                            # M2: enable HTTP/3
    http3_hq on;                         # M2: hq (HTTP-over-QUIC) frames
    quic_retry on;                       # M2: DDoS-resist via retry
    quic_gso on;                         # M2: kernel GSO if supported

    server_name chibaleteplus.chibaleteeditores.com;

    ssl_certificate /etc/letsencrypt/live/studio.chibaleteeditores.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/studio.chibaleteeditores.com/privkey.pem;

    # M1 — body size: global 100M, override 2G solo en /api/upload
    client_max_body_size 100m;

    # M1 — Security headers (HSTS nuevo)
    add_header Alt-Svc "h3=\":443\"; ma=86400" always;  # M2: advertise HTTP/3
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /healthz { access_log off; return 200 "ok
"; }

    # M1 — Upload endpoint: 2G para alinear con multer/front
    location = /api/upload {
      client_max_body_size 2g;
      proxy_request_buffering off;
      proxy_pass http://chibalete_api_pool;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Connection "";
      proxy_connect_timeout 10s;
      proxy_send_timeout 600s;
      proxy_read_timeout 600s;
      send_timeout 600s;
    }

    location ^~ /api/ {
      proxy_pass http://chibalete_api_pool;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Connection "";   # M1: necesario para keepalive upstream
      proxy_connect_timeout 5s;
      proxy_send_timeout 60s;
      proxy_read_timeout 60s;
      send_timeout 60s;
    }

    location ^~ /uploads/ {
      alias /var/uploads/;
      access_log off;
      expires 30d;                                            # M1: 7d -> 30d
      add_header Cache-Control "public, max-age=2592000, immutable";  # M1: + immutable
      add_header X-Content-Type-Options "nosniff";
    }

    location /assets/ {
      proxy_pass http://chibalete_front_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Connection "";
      expires 30d;
      add_header Cache-Control "public, max-age=2592000, immutable";
    }

    location = /index.html {
      proxy_pass http://chibalete_front_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Connection "";
      add_header Cache-Control "no-store";
    }

    location / {
      proxy_pass http://chibalete_front_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Connection "";
      add_header Cache-Control "no-store";
    }
  }

  # 2026-06-25 — Studio Editor BI (studio.chibaleteeditores.com)
  # Mismo cert SAN combinado. SIN quic/reuseport (solo el primer server 443 los declara).
  # studio_bi_front sirve la SPA y hace proxy interno de /v1/ y /admin/ a studio_bi_api.
  server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name studio.chibaleteeditores.com;

    ssl_certificate /etc/letsencrypt/live/studio.chibaleteeditores.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/studio.chibaleteeditores.com/privkey.pem;

    client_max_body_size 100m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;

    location = /healthz { access_log off; return 200 "ok
"; }

    location / {
      proxy_pass http://studio_bi_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Connection "";
    }
  }
}

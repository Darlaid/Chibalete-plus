# upstream-api.conf — superficie RELOADABLE del pool de API de Chibalete+.
#
# Vive en un directorio bind-mounted (`/etc/nginx/dynamic/`), no en un fichero
# suelto. Esa es toda la diferencia: un bind mount de FICHERO ancla el inodo
# dentro del contenedor, asi que sustituir el fichero en el host deja al edge
# leyendo la version antigua mientras `nginx -t` y `nginx -s reload` responden
# con exito. Un bind mount de DIRECTORIO resuelve cada ruta al abrirla, asi que
# un `mv` atomico dentro del directorio SI es visible.
#
# Ver docs/ops/EDGE_RELOADABLE_DRAIN_01.md.
#
# Para drenar una instancia se anade ` down` a su linea y se recarga. Nunca se
# borra la linea: mantenerla documenta que la instancia existe y esta drenada a
# proposito, y hace el rejoin trivial.

upstream chibalete_api_pool {
    least_conn;
    server chibalete_api_1:3000;
    server chibalete_api_2:3000;
    keepalive 64;
    keepalive_requests 1000;
    keepalive_timeout 60s;
}

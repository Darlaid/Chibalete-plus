# CHP-BACKUP-CAPACITY-01B — cache restic persistente para la unit.
#
# POR QUE: con ProtectHome=true el HOME de la unit queda vacio y restic corre
# SIN cache: cada ejecucion re-descarga TODOS los metadatos del repositorio
# (indices + snapshots) desde B2 como operaciones Class B. Demostrado en
# CHP-BACKUP-CAPACITY-01A con systemd-run replicando el sandbox.
#
# QUE HACE:
#   - CacheDirectory= crea /var/cache/chibalete-backup/restic (root:root 0700)
#     y lo deja ESCRIBIBLE bajo ProtectSystem=strict sin ampliar nada mas;
#   - Environment=RESTIC_CACHE_DIR llega a restic via el fallback de
#     config.py (restic_env() no hereda el entorno: sin ese fallback este
#     valor no serviria de nada).
#
# GARANTIAS: la cache no contiene secretos (metadatos cifrados del repo);
# borrarla NUNCA destruye backups (restic la reconstruye); las tres units
# comparten directorio porque el lock compartido (/run/chibalete-backup/lock)
# las serializa: jamas hay dos restic concurrentes del toolchain.
#
# ROLLBACK: eliminar este drop-in + `systemctl daemon-reload`. Opcional:
# `systemctl clean --what=cache backup-verify.service`.
[Service]
CacheDirectory=chibalete-backup/restic
CacheDirectoryMode=0700
Environment=RESTIC_CACHE_DIR=/var/cache/chibalete-backup/restic
